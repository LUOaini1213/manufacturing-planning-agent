name: Planning checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: ['ubuntu-latest']
        include:
          - python: '3.11'
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: node --check mpa/demo_assets/app.js
      - run: node --test tests/test_demo_client.cjs
      - run: python -m mpa.evaluate --output-dir artifacts/reports
      - run: python -m mpa.clsp --output-dir artifacts/reports
      - run: python -m mpa.rolling --output-dir artifacts/rolling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/mutate.py --self-test
      - run: python tests/mutate.py
