name: Planning checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=artifacts/tests.xml
      - run: python -m mpa.evaluate --output-dir artifacts/reports
      - run: python -m mpa.clsp --output-dir artifacts/reports
      - run: python -m mpa.rolling --output-dir artifacts/rolling
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-${{ matrix.python }}
          path: artifacts/
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python tests/mutate.py --self-test
      - run: python tests/mutate.py
