<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 401" role="img" aria-labelledby="title desc"><title id="title">Event-triggered rolling schedule comparison</title><desc id="desc">Gray is the immutable executed prefix. Purple is future fabrication, green future testing. Red is an outage. Dashed lines mark current time.</desc><rect width="100%" height="100%" fill="#fbfaf7"/><g font-family="sans-serif" fill="#20211f"><text x="18" y="24" font-size="16">Frozen prefix + resumed work + unstarted routing</text><text x="18" y="44" font-size="12">Gray: executed · purple: fab · green: test · red: outage · all times are absolute hours</text><text x="18" y="81" font-size="14">Original routes after the event</text><text x="18" y="114" font-size="12">M1</text><path d="M 190 123 H 950" stroke="#deddd6"/><rect x="342.000" y="95" width="304.000" height="28" fill="#f5d8d4"/><rect x="190.000" y="98" width="114.000" height="22" fill="#92968e" rx="2"><title>A/0 fab: 0–1.5</title></rect><rect x="304.000" y="98" width="38.000" height="22" fill="#92968e" rx="2"><title>A/1 fab: 1.5–2</title></rect><rect x="646.000" y="98" width="76.000" height="22" fill="#6954d9" rx="2"><title>A/1 fab: 6–7</title></rect><rect x="722.000" y="98" width="76.000" height="22" fill="#6954d9" rx="2"><title>B/0 fab: 7–8</title></rect><path d="M 342.000 95 V 123" stroke="#20211f" stroke-dasharray="4 3"/><text x="18" y="150" font-size="12">M2</text><path d="M 190 159 H 950" stroke="#deddd6"/><path d="M 342.000 131 V 159" stroke="#20211f" stroke-dasharray="4 3"/><text x="18" y="186" font-size="12">M3</text><path d="M 190 195 H 950" stroke="#deddd6"/><rect x="304.000" y="170" width="38.000" height="22" fill="#92968e" rx="2"><title>A/0 test: 1.5–2</title></rect><rect x="722.000" y="170" width="38.000" height="22" fill="#33906d" rx="2"><title>A/1 test: 7–7.5</title></rect><path d="M 342.000 167 V 195" stroke="#20211f" stroke-dasharray="4 3"/><text x="190.000" y="208" font-size="10" text-anchor="middle">0</text><text x="266.000" y="208" font-size="10" text-anchor="middle">1</text><text x="342.000" y="208" font-size="10" text-anchor="middle">2</text><text x="418.000" y="208" font-size="10" text-anchor="middle">3</text><text x="494.000" y="208" font-size="10" text-anchor="middle">4</text><text x="570.000" y="208" font-size="10" text-anchor="middle">5</text><text x="646.000" y="208" font-size="10" text-anchor="middle">6</text><text x="722.000" y="208" font-size="10" text-anchor="middle">7</text><text x="798.000" y="208" font-size="10" text-anchor="middle">8</text><text x="874.000" y="208" font-size="10" text-anchor="middle">9</text><text x="950.000" y="208" font-size="10" text-anchor="middle">10</text><text x="18" y="249" font-size="14">HiGHS future proposal (not yet confirmed)</text><text x="18" y="282" font-size="12">M1</text><path d="M 190 291 H 950" stroke="#deddd6"/><rect x="342.000" y="263" width="304.000" height="28" fill="#f5d8d4"/><rect x="190.000" y="266" width="114.000" height="22" fill="#92968e" rx="2"><title>A/0 fab: 0–1.5</title></rect><rect x="304.000" y="266" width="38.000" height="22" fill="#92968e" rx="2"><title>A/1 fab: 1.5–2</title></rect><rect x="646.000" y="266" width="76.000" height="22" fill="#6954d9" rx="2"><title>A/1 fab: 6–7</title></rect><path d="M 342.000 263 V 291" stroke="#20211f" stroke-dasharray="4 3"/><text x="18" y="318" font-size="12">M2</text><path d="M 190 327 H 950" stroke="#deddd6"/><rect x="342.000" y="302" width="76.000" height="22" fill="#6954d9" rx="2"><title>B/1 fab: 2–3</title></rect><rect x="456.000" y="302" width="76.000" height="22" fill="#6954d9" rx="2"><title>B/0 fab: 3.5–4.5</title></rect><path d="M 342.000 299 V 327" stroke="#20211f" stroke-dasharray="4 3"/><text x="18" y="354" font-size="12">M3</text><path d="M 190 363 H 950" stroke="#deddd6"/><rect x="304.000" y="338" width="38.000" height="22" fill="#92968e" rx="2"><title>A/0 test: 1.5–2</title></rect><rect x="418.000" y="338" width="38.000" height="22" fill="#33906d" rx="